name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (SQLite) · estilo · assets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, pdo_mysql, bcmath, intl, zip, gd
          coverage: none

      - name: Cache de dependencias Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Auditoría de dependencias PHP
        run: composer audit --locked

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compilar assets del frontend (Vite)
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build

      - name: Typecheck del editor Diseño (OpenDesign)
        run: npm --prefix resources/opendesign run typecheck

      - name: Tests JS partitura
        run: npm run test:partitura

      - name: Verificar formato de codigo (Pint)
        run: vendor/bin/pint --test

      - name: Análisis estático (Larastan, con línea base)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Auditoría de dependencias JS (producción)
        run: npm audit --omit=dev --audit-level=high

      - name: Skip-link en layouts (a11y)
        run: |
          grep -q 'ito-skip' resources/views/layouts/app.blade.php
          grep -q 'contenido-principal' resources/views/layouts/app.blade.php
          grep -q 'prefers-reduced-motion' public/css/chilinga-admin.css

      - name: Validar rutas (web + API v1)
        run: |
          php artisan route:list --path=api/v1 --json > /tmp/rutas.json
          php -r '$r = json_decode(file_get_contents("/tmp/rutas.json"), true); if (count($r) < 40) { fwrite(STDERR, "Faltan rutas de la API v1\n"); exit(1); } echo count($r), " rutas API v1\n";'

      - name: Ejecutar tests (incluye API, autorización e identidad)
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test

  mysql:
    name: Migraciones y tests en MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: chilinga_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: chilinga_ci
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, bcmath, intl, zip, gd
          coverage: none

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrar base vacía (instalación nueva)
        run: php artisan migrate --force

      - name: Revertir y re-aplicar la migración de plataforma (down/up)
        run: |
          php artisan migrate:rollback --step=9 --force
          php artisan migrate --force

      - name: Diagnóstico de datos
        run: php artisan chilinga:diagnose

      - name: Tests sobre MySQL
        run: |
          set -o pipefail
          php artisan test 2>&1 | tee /tmp/tests-mysql.log

      - name: Publicar fallos como anotación
        if: failure()
        run: |
          # Las anotaciones son visibles sin permisos de admin (los logs completos no).
          resumen=$(grep -E -A12 "FAILED|Failed asserting|SQLSTATE|Error:" /tmp/tests-mysql.log | head -120 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Tests MySQL::${resumen}"

  mobile:
    name: App móvil (typecheck · lint · tests · bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (pantallas y cliente API con la API simulada)
        run: npm test -- --ci

      - name: Bundle Android + iOS (sin compilar nativo)
        env:
          APP_VARIANT: production
          EXPO_PUBLIC_API_URL: https://ci.invalid/api/v1
        run: npx expo export --platform android --platform ios --output-dir /tmp/expo-dist

  docker:
    name: Imagen Docker (build + arranque + /salud)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: chilinga_docker
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Revisar start.sh (sintaxis + shellcheck)
        run: |
          sh -n start.sh
          shellcheck start.sh

      - uses: docker/setup-buildx-action@v3

      - name: Build de la imagen de producción
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: chilinga-admin:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Como root + volumen, igual que Railway con RAILWAY_RUN_UID=0: start.sh baja a www-data.
      - name: Arrancar el contenedor y esperar /salud
        run: |
          docker run -d --name web --network host --user root \
            -e PORT=18080 -e APP_ENV=production -e APP_DEBUG=false \
            -e APP_KEY="base64:$(openssl rand -base64 32)" -e APP_URL=http://127.0.0.1:18080 \
            -e DB_CONNECTION=mysql -e DB_HOST=127.0.0.1 -e DB_PORT=3306 \
            -e DB_DATABASE=chilinga_docker -e DB_USERNAME=root -e DB_PASSWORD=root \
            -e PERSISTENT_STORAGE_PATH=/data/storage -e PERC_KIT_REBUILD=0 \
            chilinga-admin:ci
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/salud; then echo; ok=1; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' web)" != "true" ]; then break; fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo "/salud no respondió"; exit 1; }
          curl -fsS -o /dev/null http://127.0.0.1:18080/login
          docker exec web sh -c 'grep -Eq "^Uid:[[:space:]]+33[[:space:]]" /proc/1/status' \
            || { echo "El servidor no corre como www-data"; exit 1; }

      - name: Logs del contenedor
        if: always()
        run: docker logs web 2>&1 | tail -200 || true
