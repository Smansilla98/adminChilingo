; OPcache para producción: el código no cambia dentro del contenedor (cada deploy es una imagen nueva).
; Los cachés de Laravel (config/rutas/vistas) se generan en start.sh antes de arrancar el servidor.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
expose_php = Off
